services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gtm
      POSTGRES_USER: gtm
      POSTGRES_PASSWORD: gtm-local-only
    ports:
      - "5432:5432"
    volumes:
      - gtm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtm -d gtm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gtm_pgdata:
